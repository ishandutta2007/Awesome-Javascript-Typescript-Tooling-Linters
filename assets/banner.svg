<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="jsTsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7df1e" />
      <stop offset="45%" stop-color="#3178c6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7df1e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f7df1e" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3178c6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="badgeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glowYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <!-- Animated Shimmer Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.6; }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.4; }
      50% { transform: scale(1.2) translate(-20px, 15px); opacity: 0.65; }
    }
    @keyframes codeStream {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes badgeFloat1 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes badgeFloat2 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }
    .orb-yellow {
      animation: pulseOrb 7s ease-in-out infinite;
      transform-origin: 180px 100px;
    }
    .orb-blue {
      animation: floatOrb2 8s ease-in-out infinite;
      transform-origin: 1050px 240px;
    }
    .circuit-line {
      stroke-dasharray: 200 400;
      animation: codeStream 6s linear infinite;
    }
    .pill-1 { animation: badgeFloat1 4s ease-in-out infinite; }
    .pill-2 { animation: badgeFloat2 5s ease-in-out infinite 0.5s; }
    .pill-3 { animation: badgeFloat1 4.5s ease-in-out infinite 1s; }
    .pill-4 { animation: badgeFloat2 5.5s ease-in-out infinite 1.5s; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-yellow" cx="180" cy="90" r="130" fill="#f59e0b" filter="url(#glowYellow)" />
  <circle class="orb-blue" cx="1060" cy="240" r="150" fill="#2563eb" filter="url(#glowBlue)" />
  <circle cx="600" cy="330" r="100" fill="#7c3aed" filter="url(#glowPurple)" opacity="0.3" />

  <!-- Animated Circuit Streamlines -->
  <path class="circuit-line" d="M 0 60 Q 300 120 600 60 T 1200 60" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  <path class="circuit-line" d="M 0 300 Q 350 240 700 300 T 1200 280" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.35" style="animation-duration: 8s;" />

  <!-- Main Foreground Typography & Branding -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Super-header / Topic tag -->
    <rect x="-190" y="-72" width="380" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="0" y="-53" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2">
      ⚡ THE MODERN JAVASCRIPT &amp; TYPESCRIPT ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="0" y="5" fill="url(#jsTsGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome JS/TS Tooling &amp; Linters
    </text>

    <!-- Subtitle -->
    <text x="0" y="46" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">
      Next-Gen Rust Linters • Type Checkers • Ultra-Fast Formatters • Static Analysis • Cloud Code Quality
    </text>
  </g>

  <!-- Interactive / Modern Feature Badges & Metric Pills -->
  <g transform="translate(600, 225)">
    <!-- Pill 1: Rust & Zig Speed -->
    <g class="pill-1" transform="translate(-490, 0)">
      <rect width="230" height="52" rx="12" fill="url(#badgeGrad1)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="24" y="32" font-size="20">🦀</text>
      <text x="56" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Next-Gen Speed</text>
      <text x="56" y="41" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">Rust &amp; Zig Performance</text>
    </g>

    <!-- Pill 2: Industrial Linters -->
    <g class="pill-2" transform="translate(-240, 0)">
      <rect width="230" height="52" rx="12" fill="url(#badgeGrad2)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="24" y="32" font-size="20">🔍</text>
      <text x="56" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">ESLint &amp; Biome</text>
      <text x="56" y="41" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">Rules, AST &amp; Style Fixers</text>
    </g>

    <!-- Pill 3: Static Analysis -->
    <g class="pill-3" transform="translate(10, 0)">
      <rect width="230" height="52" rx="12" fill="url(#badgeGrad3)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="24" y="32" font-size="20">🛡️</text>
      <text x="56" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">SAST &amp; Dead Code</text>
      <text x="56" y="41" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">Knip, Semgrep &amp; Snyk</text>
    </g>

    <!-- Pill 4: Type Checkers -->
    <g class="pill-4" transform="translate(260, 0)">
      <rect width="230" height="52" rx="12" fill="url(#badgeGrad2)" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="24" y="32" font-size="20">📘</text>
      <text x="56" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Type Verification</text>
      <text x="56" y="41" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">TypeScript, SWC &amp; Attw</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#jsTsGrad)" />
</svg>
